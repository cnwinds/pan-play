<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>盘游</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <p class="mark">盘游</p>
      <label class="search">
        <span class="visually-hidden">搜索游戏</span>
        <input id="search" type="search" placeholder="搜索游戏名或 Title ID" autocomplete="off" spellcheck="false">
      </label>
      <nav class="tabs" aria-label="主视图">
        <button type="button" id="show-shelf" class="tab" aria-current="page">游戏库</button>
        <button type="button" id="show-settings" class="tab">设置</button>
      </nav>
    </div>
  </header>

  <main id="shelf-view" class="view">
    <section class="login" id="login-box" hidden aria-labelledby="login-title">
      <div class="login-card">
        <h1 id="login-title">登录百度网盘</h1>
        <p class="login-text" id="login-text">正在确认登录…</p>
        <figure class="qr-wrap" id="qr-wrap" hidden>
          <img id="qr" alt="" width="200" height="200">
        </figure>
        <p class="user-code" id="user-code"></p>
        <button type="button" id="start-login" class="btn primary">显示登录二维码</button>
      </div>
    </section>

    <section class="library" id="library" aria-labelledby="library-title">
      <header class="library-head">
        <div>
          <h1 id="library-title">游戏库 <span class="count num" id="game-count"></span></h1>
          <p class="lede" id="lede">正在读取网盘里的游戏…</p>
        </div>
        <div class="filters" role="group" aria-label="筛选">
          <button type="button" class="filter" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="filter" data-filter="installed" aria-pressed="false">已安装</button>
          <button type="button" class="filter" data-filter="continue" aria-pressed="false">未装完</button>
          <button type="button" class="filter" data-filter="todo" aria-pressed="false">未安装</button>
        </div>
      </header>
      <div class="shelf" id="shelf"></div>
      <p class="empty" id="shelf-empty" hidden></p>
      <p class="shelf-more" id="shelf-more" role="status" hidden></p>
      <div class="shelf-end" id="shelf-end" aria-hidden="true"></div>
    </section>
  </main>

  <main id="settings-view" class="view settings" hidden>
    <h1>设置</h1>
    <form id="settings-form" class="settings-form">
      <section class="settings-section" aria-labelledby="set-baidu">
        <div class="settings-intro">
          <h2 id="set-baidu">百度网盘</h2>
          <p>AppKey 和 SecretKey 在百度网盘开放平台创建应用后得到，只保存在这台电脑上。</p>
        </div>
        <div class="fields">
          <label class="field">AppKey<input name="app_key" autocomplete="off" spellcheck="false"></label>
          <label class="field">SecretKey<input name="secret_key" type="password" autocomplete="off" spellcheck="false"></label>
          <label class="field">游戏库目录
            <input name="library_path" placeholder="/游戏资源/PS5" spellcheck="false">
            <span class="hint">网盘里放游戏文件夹的目录，每个子文件夹算一个游戏。</span>
          </label>
        </div>
      </section>
      <section class="settings-section" aria-labelledby="set-console">
        <div class="settings-intro">
          <h2 id="set-console">主机</h2>
          <p>游戏会边下载边解压，直接写到这里。</p>
        </div>
        <div class="fields">
          <label class="field">存放位置
            <input name="dest" placeholder="ftp://192.168.1.20:2121" spellcheck="false">
            <span class="hint">PS5 的 FTP 地址，也可以填这台电脑上的目录。</span>
          </label>
          <label class="field">主机目录
            <input name="prefix" placeholder="/mnt/usb0/homebrew" spellcheck="false">
            <span class="hint">每个游戏装到这个目录下以 Title ID 命名的文件夹里。</span>
          </label>
        </div>
      </section>
      <div class="settings-actions">
        <button type="submit" class="btn primary">保存设置</button>
        <p class="note" id="settings-note" role="status"></p>
      </div>
    </form>

    <section class="settings-section catalog" aria-labelledby="catalog-heading">
      <div class="settings-intro">
        <h2 id="catalog-heading">游戏资料库</h2>
        <p>用来把 Title ID 认成游戏名，数据来自 PlayStation-Titles，会在后台自动更新。</p>
      </div>
      <div class="fields">
        <p class="catalog-status" id="catalog-status">正在读取资料库状态…</p>
        <div class="settings-actions">
          <button type="button" class="btn quiet" id="catalog-reload">重新加载资料库</button>
          <p class="note" id="catalog-note" role="status"></p>
        </div>
      </div>
    </section>
  </main>

  <aside class="dock" id="dock" hidden aria-label="安装队列">
    <div class="dock-panel" id="dock-panel" hidden>
      <div class="dock-panel-head">
        <h2>安装队列</h2>
        <button type="button" class="link" id="dock-clear">清除已完成</button>
      </div>
      <ol class="queue-list" id="queue-list"></ol>
    </div>
    <div class="dock-bar">
      <button type="button" class="dock-open" id="dock-open">
        <span class="dock-art" id="dock-art"></span>
        <span class="dock-text">
          <strong id="dock-title"></strong>
          <span id="dock-status" role="status"></span>
        </span>
      </button>
      <button type="button" class="dock-toggle" id="dock-toggle" aria-expanded="false" aria-controls="dock-panel"
              aria-label="展开安装队列">
        <span class="chevron" aria-hidden="true"></span>
      </button>
      <span class="meter dock-meter" aria-hidden="true"><span id="dock-meter"></span></span>
      <button type="button" class="btn quiet small" id="dock-action">取消</button>
    </div>
  </aside>

  <section class="unlock" id="unlock-box" hidden aria-labelledby="unlock-title">
    <form class="login-card" id="unlock-form">
      <h1 id="unlock-title">输入访问口令</h1>
      <p class="login-text">口令在主机启动盘游时的通知里，也写在数据目录的 access-code.txt。</p>
      <label class="field">访问口令
        <input name="code" inputmode="numeric" autocomplete="off" spellcheck="false" required>
      </label>
      <button type="submit" class="btn primary">进入</button>
      <p class="note error" id="unlock-note" role="status"></p>
    </form>
  </section>

  <div class="drawer-root" id="detail-overlay" hidden>
    <button type="button" class="scrim" id="detail-backdrop" tabindex="-1" aria-label="关闭详情"></button>
    <section class="drawer" id="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button type="button" class="drawer-close" id="detail-close" aria-label="关闭">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="drawer-body" id="detail-body"></div>
    </section>
  </div>
  <script src="/app.js"></script>
</body>
</html>
