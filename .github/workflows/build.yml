name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # 自测也要用 7-Zip 现做测试 7z。
      - name: 安装依赖
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build 7zip
          echo "PANPLAY_7Z=$(command -v 7zz || command -v 7z)" >> "$GITHUB_ENV"

      # 自测要用 RAR 命令行现做测试压缩包。
      - name: 下载 RAR 命令行
        run: |
          path=$(curl -fsSL https://www.rarlab.com/download.htm | grep -oE 'rar/rarlinux-x64-[0-9]+\.tar\.gz' | head -1)
          curl -fsSL "https://www.rarlab.com/$path" -o rar.tar.gz
          tar xzf rar.tar.gz
          echo "PANPLAY_RAR=$PWD/rar/rar" >> "$GITHUB_ENV"

      - name: 编译
        run: |
          set -o pipefail
          { cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build-linux; } 2>&1 | tee build.log \
            || { .github/report-errors.sh build.log; exit 1; }

      - name: 自测
        run: |
          set -o pipefail
          ./build-linux/panplay self-test 2>&1 | tee test.log || { .github/report-errors.sh test.log; exit 1; }

      - name: HTTPS 连通
        run: |
          set -o pipefail
          { ./build-linux/panplay http-get https://pan.baidu.com/ \
              && ./build-linux/panplay http-get https://raw.githubusercontent.com/andshrew/PlayStation-Titles/main/README.md; } 2>&1 \
            | tee http.log || { .github/report-errors.sh http.log; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: panplay-linux
          path: build-linux/panplay

  ps5:
    runs-on: ubuntu-24.04
    env:
      PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
    steps:
      - uses: actions/checkout@v5

      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-18 lld-18 llvm-18 unzip

      - name: 安装 ps5-payload-sdk
        run: |
          curl -fsSL https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip -o sdk.zip
          sudo unzip -q -d /opt sdk.zip

      - name: 编译
        run: |
          set -o pipefail
          { "$PS5_PAYLOAD_SDK/bin/prospero-cmake" -S . -B build-ps5 -G Ninja -DCMAKE_BUILD_TYPE=Release \
              && cmake --build build-ps5; } 2>&1 | tee build.log \
            || { .github/report-errors.sh build.log; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: panplay-ps5
          path: build-ps5/panplay.elf

  # 自测要 WinRAR 和 7-Zip 生成测试压缩包，这里没有，自测交给 linux 那边。
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib

      # 界面打包进 exe，发出去只有一个文件。
      - name: 编译
        run: |
          set -o pipefail
          { cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release -DPANPLAY_EMBED_UI=ON \
              && cmake --build build-win; } 2>&1 | tee build.log \
            || { .github/report-errors.sh build.log; exit 1; }

      - name: 检查能单独运行
        run: |
          set -o pipefail
          if objdump -p build-win/panplay.exe | grep -iE 'DLL Name: (lib|zlib)'; then
            echo "::error title=动态依赖::panplay.exe 还依赖 MinGW 的 DLL，别的电脑上打不开"
            exit 1
          fi
          ./build-win/panplay.exe http-get https://pan.baidu.com/ > http.log 2>&1 || { .github/report-errors.sh http.log; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: panplay-windows
          path: build-win/panplay.exe

  # 推送 v 开头的标签时发布：Windows 的 exe 和 PS5 的 elf 挂到 Release 上。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, ps5, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: panplay-{windows,ps5}
          path: dist
          merge-multiple: true

      - name: 整理文件
        run: |
          mv dist/panplay.exe "dist/panplay-${GITHUB_REF_NAME}-windows-x64.exe"
          mv dist/panplay.elf "dist/panplay-${GITHUB_REF_NAME}-ps5.elf"
          cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            **Windows**：下载 `panplay-${{ github.ref_name }}-windows-x64.exe`，双击运行，会自动用浏览器打开 http://127.0.0.1:8734 。局域网里的手机、平板默认也能打开（地址在设置页「局域网访问」里，第一次运行时 Windows 防火墙可能会询问，允许专用网络即可）。
            **PS5**：把 `panplay-${{ github.ref_name }}-ps5.elf` 用 payload 加载器发送到主机，主机右上角的通知里有访问地址，用手机或电脑浏览器打开。
            局域网访问默认不要口令（面向家里的内网）；需要的话在设置页「局域网访问」里开启访问口令，Windows 上也可以关掉局域网访问。PS5 默认把游戏装到 `/data/homebrew`。
            两个文件都自带游戏资料库，不用另外下载；联网后会自动从 GitHub 同步最新版，存在数据目录（Windows 是 `%APPDATA%\panplay`，PS5 是 `/data/panplay`）。
            网盘游戏目录怎么放，见 [网盘游戏目录整理指南](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/game-folder-guide.md)。
